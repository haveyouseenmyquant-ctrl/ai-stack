name: Laptop Doctor safety suite
on:
  push:
    branches: [laptop-doctor]
  pull_request:
    paths: ["Sources/AIStack/Doctor/**", "windows/helper/Doctor/**", "shared/**", "tests/safety/**", "tests/windows/**", "fixtures/**", ".github/workflows/doctor.yml"]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      # The checkup uses a user-installed ClamAV if present; CI installs one so the EICAR fixture is really scanned.
      - name: Install ClamAV
        continue-on-error: true
        run: |
          brew install clamav
          etc="$(brew --prefix)/etc/clamav"
          sed -e 's/^Example/#Example/' "$etc/freshclam.conf.sample" > "$etc/freshclam.conf"
          mkdir -p "$(brew --prefix)/var/lib/clamav"
      - name: Cache ClamAV signatures
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/var/lib/clamav
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-
      - name: Update ClamAV signatures
        continue-on-error: true
        timeout-minutes: 8
        run: freshclam --stdout && ls -la "$(brew --prefix)/var/lib/clamav"
      - name: Safety suite
        env: { CI: "true" }
        run: python3 tests/safety/run_safety.py --bin .build/debug/AIStack --work "$RUNNER_TEMP/doctor" --out doctor-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-results-macos
          path: doctor-results.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          dotnet build windows/helper -c Debug -nologo
          dotnet build tests/windows/CloudTestProvider -c Debug -nologo
          dotnet tool install -g dotnet-stack
      - name: Safety suite
        env:
          CI: "true"
          LD_CLOUD_PROVIDER: ${{ github.workspace }}\tests\windows\CloudTestProvider\bin\Debug\net10.0\CloudTestProvider.exe
        run: python tests/safety/run_safety.py --bin windows/helper/bin/Debug/net10.0/AIStackHelper.exe --work "$env:RUNNER_TEMP/doctor" --out doctor-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-results-windows
          path: doctor-results.json
