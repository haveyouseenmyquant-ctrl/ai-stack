name: Laptop Doctor safety suite
on:
  push:
    branches: [laptop-doctor]
  pull_request:
    paths: ["Sources/AIStack/Doctor/**", "windows/helper/Doctor/**", "shared/**", "tests/safety/**", "tests/windows/**", "fixtures/**", ".github/workflows/doctor.yml"]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      # The checkup uses a user-installed ClamAV if present; CI provides one so the EICAR fixture is really scanned.
      # Homebrew's clamav 1.5.4_1 bottle links OpenSSL 4, with which libclamav can't hash anything (every CVD fails its
      # signature check, every scan "error calculating sha2-256 hash"). CI therefore uses Cisco-Talos's official macOS
      # pkg, expanded (not installed) into the runner's temp folder; a wrapper points it at its bundled libraries and
      # signature folder, and the suite passes the wrapper to the planted-issue scan (LD_REAL_CLAMSCAN).
      - name: Install ClamAV
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download clamav-1.5.4 -R Cisco-Talos/clamav -p 'clamav-1.5.4.macos.universal.pkg' -D "$RUNNER_TEMP"
          pkgutil --expand-full "$RUNNER_TEMP/clamav-1.5.4.macos.universal.pkg" "$RUNNER_TEMP/clampkg"
          c="$RUNNER_TEMP/clamav"; mkdir -p "$c/bin" "$c/db"
          for part in programs libraries; do cp -R "$RUNNER_TEMP/clampkg/clamav-1.5.4.macos.universal-$part.pkg/Payload/usr/local/clamav/." "$c/"; done
          printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\n' "$c/db" > "$c/freshclam.conf"
          for tool in clamscan freshclam; do
            extra=$([ "$tool" = clamscan ] && echo "--database=$c/db" || echo "--config-file=$c/freshclam.conf")
            printf '#!/bin/sh\nCVD_CERTS_DIR="%s/etc/certs" DYLD_LIBRARY_PATH="%s/lib" exec "%s/bin/%s" %s "$@"\n' "$c" "$c" "$c" "$tool" "$extra" > "$c/$tool"
            chmod +x "$c/$tool"
          done
          "$c/clamscan" --version
          echo "CLAM=$c" >> "$GITHUB_ENV"
          echo "LD_REAL_CLAMSCAN=$c/clamscan" >> "$GITHUB_ENV"
      - name: Restore ClamAV signatures
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clamav/db
          key: clamav-pkg-db-${{ github.run_id }}
          restore-keys: clamav-pkg-db-
      # The DB must detect EICAR before it is used or cached; otherwise it is downloaded again from scratch.
      - name: Update ClamAV signatures
        id: clamdb
        continue-on-error: true
        timeout-minutes: 10
        run: |
          probe="$RUNNER_TEMP/clamprobe"; mkdir -p "$probe"
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > "$probe/eicar.com"
          works() { local r=0; "$CLAM/clamscan" --no-summary "$probe/eicar.com" || r=$?; [ "$r" -eq 1 ]; }
          "$CLAM/freshclam" --stdout || true
          if ! works; then
            echo "DB does not detect EICAR; downloading it again"
            rm -f "$CLAM"/db/*.c[lv]d; "$CLAM/freshclam" --stdout || true
          fi
          works
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Save ClamAV signatures
        if: steps.clamdb.outputs.verified == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clamav/db
          key: clamav-pkg-db-${{ github.run_id }}
      - name: Safety suite
        env: { CI: "true" }
        run: python3 tests/safety/run_safety.py --bin .build/debug/AIStack --work "$RUNNER_TEMP/doctor" --out doctor-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-results-macos
          path: doctor-results.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          dotnet build windows/helper -c Debug -nologo
          dotnet build tests/windows/CloudTestProvider -c Debug -nologo
          dotnet tool install -g dotnet-stack
      # The runner image excludes whole drives from Defender, so nothing under D:\a\_temp (the fixture) is ever
      # scanned. Drop the exclusions on this throwaway VM so the EICAR fixture meets a normally configured Defender.
      - name: Defender as on a normal PC
        continue-on-error: true
        run: |
          $p = Get-MpPreference
          "exclusions: " + ($p.ExclusionPath -join ', ')
          if ($p.ExclusionPath) { Remove-MpPreference -ExclusionPath $p.ExclusionPath }
          $s = Get-MpComputerStatus
          "realtime=$($s.RealTimeProtectionEnabled) antivirus=$($s.AntivirusEnabled) mode=$($s.AMRunningMode)"
      - name: Safety suite
        env:
          CI: "true"
          LD_CLOUD_PROVIDER: ${{ github.workspace }}\tests\windows\CloudTestProvider\bin\Debug\net10.0\CloudTestProvider.exe
        run: python tests/safety/run_safety.py --bin windows/helper/bin/Debug/net10.0/AIStackHelper.exe --work "$env:RUNNER_TEMP/doctor" --out doctor-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-results-windows
          path: doctor-results.json
