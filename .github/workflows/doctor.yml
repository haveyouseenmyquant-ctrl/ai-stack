name: Laptop Doctor safety suite
on:
  push:
    branches: [laptop-doctor]
  pull_request:
    paths: ["Sources/AIStack/Doctor/**", "windows/helper/Doctor/**", "shared/**", "tests/safety/**", "tests/windows/**", "fixtures/**", ".github/workflows/doctor.yml"]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      # The checkup uses a user-installed ClamAV if present; CI installs one so the EICAR fixture is really scanned.
      - name: Install ClamAV
        continue-on-error: true
        run: |
          brew install clamav
          etc="$(brew --prefix)/etc/clamav"
          sed -e 's/^Example/#Example/' "$etc/freshclam.conf.sample" > "$etc/freshclam.conf"
          mkdir -p "$(brew --prefix)/var/lib/clamav"
          # ClamAV 1.5 verifies the .cvd.sign files with the certs it ships; freshclam's "NULL X509 store" means it
          # can't find them, so point CVD_CERTS_DIR (read by freshclam and clamscan) at the bottle's copy.
          clamscan --version
          certs="$(find "$(brew --prefix clamav)/" "$(brew --prefix)/etc/clamav" -name '*.crt' 2>/dev/null | head -1)"
          echo "ClamAV certs: ${certs:-none found}"
          [ -n "$certs" ] && echo "CVD_CERTS_DIR=$(dirname "$certs")" >> "$GITHUB_ENV"
      - name: Restore ClamAV signatures
        uses: actions/cache/restore@v4
        with:
          path: /opt/homebrew/var/lib/clamav
          key: clamav-db-${{ github.run_id }}
          restore-keys: clamav-db-
      # Homebrew's ClamAV 1.5.4 bottle rejects the signature of every published CVD ("cli_loadinfo: Incorrect digital
      # signature" for main.cvd too; freshclam: "NULL X509 store"), so no packed database loads. The CVDs are a 512-byte
      # header plus a tarball of plain signature files, and clamscan loads plain files without the signature check:
      # freshclam downloads them (TestDatabases off, so it keeps them), then they are unpacked in place. Same
      # signatures, nothing hand-written. The DB must detect EICAR before it is used or cached.
      - name: Update ClamAV signatures
        id: clamdb
        continue-on-error: true
        timeout-minutes: 10
        run: |
          db="$(brew --prefix)/var/lib/clamav"
          echo "TestDatabases no" >> "$(brew --prefix)/etc/clamav/freshclam.conf"
          probe="$RUNNER_TEMP/clamprobe"; mkdir -p "$probe"
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > "$probe/eicar.com"
          works() { local r=0; clamscan --no-summary "$probe/eicar.com" || r=$?; [ "$r" -eq 1 ]; }
          if ! works; then
            rm -rf "${db:?}"/*
            freshclam --stdout || true
            ls -l "$db"
            python3 -I - "$db" <<'PY'
          import glob, io, os, sys, tarfile
          db = sys.argv[1]
          for p in glob.glob(os.path.join(db, "*.cvd")) + glob.glob(os.path.join(db, "*.cld")):
              name = os.path.basename(p)
              if name.startswith("bytecode."):  # unsigned bytecode needs --bytecode-unsigned; EICAR doesn't need it
                  os.remove(p); continue
              with open(p, "rb") as f:
                  f.seek(512)
                  with tarfile.open(fileobj=io.BytesIO(f.read()), mode="r:*") as t:
                      for m in t.getmembers():
                          if m.isfile() and not m.name.endswith(".info") and "/" not in m.name:
                              t.extract(m, db, filter="data")
              os.remove(p)
              print("unpacked", name)
          PY
            ls -l "$db"
          fi
          if ! works; then
            # "fmap_get_hash: error calculating sha2-256 hash" = the bottle's OpenSSL can't hash at all. Try likely
            # environment causes and keep the first that works (exported for the suite's clamscan).
            env | grep -i -E 'ssl|crypto' || true
            otool -L "$(brew --prefix clamav)/lib/libclamav.dylib" | grep -i -E 'ssl|crypto' || true
            ossl="$(brew --prefix openssl@3)"
            for try in "OPENSSL_CONF=/dev/null" "OPENSSL_MODULES=$ossl/lib/ossl-modules" "OPENSSL_CONF=$ossl/etc/openssl@3/openssl.cnf" \
                       "OPENSSL_CONF=/dev/null OPENSSL_MODULES=$ossl/lib/ossl-modules"; do
              echo "trying: $try"
              if env $try clamscan --no-summary "$probe/eicar.com"; [ $? -eq 1 ]; then
                for kv in $try; do echo "$kv" >> "$GITHUB_ENV"; export "$kv"; done
                break
              fi
            done
          fi
          works
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Save ClamAV signatures
        if: steps.clamdb.outputs.verified == 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/homebrew/var/lib/clamav
          key: clamav-db-${{ github.run_id }}
      - name: Safety suite
        env: { CI: "true" }
        run: python3 tests/safety/run_safety.py --bin .build/debug/AIStack --work "$RUNNER_TEMP/doctor" --out doctor-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-results-macos
          path: doctor-results.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          dotnet build windows/helper -c Debug -nologo
          dotnet build tests/windows/CloudTestProvider -c Debug -nologo
          dotnet tool install -g dotnet-stack
      # The runner image excludes whole drives from Defender, so nothing under D:\a\_temp (the fixture) is ever
      # scanned. Drop the exclusions on this throwaway VM so the EICAR fixture meets a normally configured Defender.
      - name: Defender as on a normal PC
        continue-on-error: true
        run: |
          $p = Get-MpPreference
          "exclusions: " + ($p.ExclusionPath -join ', ')
          if ($p.ExclusionPath) { Remove-MpPreference -ExclusionPath $p.ExclusionPath }
          $s = Get-MpComputerStatus
          "realtime=$($s.RealTimeProtectionEnabled) antivirus=$($s.AntivirusEnabled) mode=$($s.AMRunningMode)"
      - name: Safety suite
        env:
          CI: "true"
          LD_CLOUD_PROVIDER: ${{ github.workspace }}\tests\windows\CloudTestProvider\bin\Debug\net10.0\CloudTestProvider.exe
        run: python tests/safety/run_safety.py --bin windows/helper/bin/Debug/net10.0/AIStackHelper.exe --work "$env:RUNNER_TEMP/doctor" --out doctor-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-results-windows
          path: doctor-results.json
